# =========================================================================
# STRATA 3D Public Showcase · 可选 Nginx 参考模板（非 49.233.186.35 默认方案）
# -------------------------------------------------------------------------
# 重要提醒：目标服务器 49.233.186.35 的 80/443 端口已由现役 Caddy 占用！
# 在 49.233.186.35 上请直接使用 Caddyfile.snippet（严禁另起 Nginx 抢占 80/443）。
# 本模板仅用于其它未安装 Caddy 的纯 Nginx 服务器，且默认监听 127.0.0.1:8857。
# =========================================================================

upstream strata_readonly_backend {
    server 127.0.0.1:8856;
    keepalive 16;
}

server {
    listen 127.0.0.1:8857;
    server_name _;

    root /srv/strata_showcase;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Strata-Mode "READONLY_PUBLIC_SHOWCASE" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 如需 Brotli（需 ngx_brotli 模块），取消以下注释：
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/identifiability/ {
        limit_except GET HEAD POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://strata_readonly_backend;
    }

    location ~ ^/api/(edit|project|projects|save|export|portable|solve|migrate) {
        default_type application/json;
        return 403 '{"ok":false,"error":{"code":"READONLY_PUBLIC_SHOWCASE","message":"公网展示版为纯只读模式"}}';
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
